<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo-mf.png" type="image/png" />
  <title>Detail Proyek — Muhammad Fakhrul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body class="detail-body">
  <div class="grain"></div>

  <header class="nav scrolled" id="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img class="logo-mark" src="logo-mf.png" alt="Muhammad Fakhrul" />
        <span class="logo-text">Muhammad Fakhrul</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#services" id="backNav">← Kembali</a>
        <a href="index.html#contact" class="nav-cta">Hubungi Saya</a>
      </nav>
    </div>
  </header>

  <main class="detail" id="detail">
    <div class="container"><p class="detail-loading">Memuat…</p></div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Tutup">✕</button>
    <img id="lbImg" alt="" />
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Muhammad Fakhrul — Creative Professional</p>
      <a href="index.html#services" class="to-top">← Semua proyek</a>
    </div>
  </footer>

  <script>
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const cat = params.get("cat");
    // Kembali ke daftar kategori sebelumnya bila ada, jika tidak ke portofolio.
    const backHref = cat ? ("index.html?cat=" + encodeURIComponent(cat) + "#services") : "index.html#services";
    const backNav = document.getElementById("backNav");
    if (backNav) backNav.href = backHref;
    const root = document.getElementById("detail").querySelector(".container");
    document.getElementById("year").textContent = new Date().getFullYear();

    (async function () {
      let content;
      try { content = await (await fetch("/api/content")).json(); }
      catch (e) { root.innerHTML = '<h1>Gagal memuat</h1>'; return; }
      const p = content.projects && content.projects[id];
      if (!p) { root.innerHTML = '<div class="detail-head"><h1>Proyek tidak ditemukan</h1><p class="lead">Kembali ke <a href="index.html#services">portofolio</a>.</p></div>'; return; }
      document.title = p.name + " — Muhammad Fakhrul";
      const shots = p.shots || [];
      const shotsBlock = shots.length
        ? `<h2 class="detail-sub">Tampilan Aplikasi</h2><div class="shots">${shots.map((s) => `<figure class="shot"><img src="${esc(s.src)}" alt="${esc(s.cap || p.name)}" loading="lazy" class="zoomable" /><figcaption>${esc(s.cap || "")}</figcaption></figure>`).join("")}</div>`
        : `<div class="no-shots">📷 Belum ada tangkapan layar untuk proyek ini.</div>`;
      root.innerHTML = `
        <a href="${backHref}" class="back-link">← Kembali ke Portofolio</a>
        <div class="detail-hero">
          <div class="detail-cover"><img src="${esc(p.cover)}" alt="${esc(p.name)}" class="zoomable" /></div>
          <div class="detail-intro">
            <span class="kicker">${esc(p.tag)}</span>
            <h1>${esc(p.name)}</h1>
            <p class="lead">${esc(p.summary)}</p>
            <div class="meta-row">
              <div class="meta"><span>Tahun</span><b>${esc(p.year || "-")}</b></div>
              <div class="meta"><span>Peran</span><b>${esc(p.role || "-")}</b></div>
            </div>
            <div class="tech">${(p.tech || []).map((t) => `<span>${esc(t)}</span>`).join("")}</div>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-main">
            <h2 class="detail-sub">Tentang Proyek</h2>
            ${(p.desc || []).map((d) => `<p>${esc(d)}</p>`).join("")}
            ${shotsBlock}
          </div>
          <aside class="detail-side">
            <h3>Fitur Utama</h3>
            <ul class="feat-list">${(p.features || []).map((f) => `<li><span class="fk">✓</span>${esc(f)}</li>`).join("")}</ul>
            <a href="index.html#contact" class="btn btn-primary btn-full">Diskusikan Proyek Serupa</a>
          </aside>
        </div>`;
    })();

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    function closeLb() { lightbox.classList.remove("open"); lightbox.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
    document.getElementById("lbClose").addEventListener("click", closeLb);
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLb(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLb(); });
    root.addEventListener("click", (e) => {
      const img = e.target.closest("img.zoomable");
      if (img) { lbImg.src = img.src; lbImg.alt = img.alt; lightbox.classList.add("open"); lightbox.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
    });
  </script>
</body>
</html>
