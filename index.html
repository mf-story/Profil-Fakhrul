<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo-mf.png" type="image/png" />
  <meta name="description" content="Portofolio profesional Muhammad Fakhrul — Pendidik, Fotografer, Videografer, Editor, Pilot Drone, dan Pengembang Website dan Aplikasi Android." />
  <title>Muhammad Fakhrul — Creative Professional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="grain"></div>

  <!-- Navbar -->
  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="#hero" class="logo">
        <img class="logo-mark" src="logo-mf.png" alt="Muhammad Fakhrul" />
        <span class="logo-text">Muhammad Fakhrul</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="#hero" class="nav-menu-logo">
          <img class="logo-mark" src="logo-mf.png" alt="Muhammad Fakhrul" />
          <span>Muhammad Fakhrul</span>
        </a>
        <a href="#services">Keahlian</a>
        <a href="#education">Pendidikan</a>
        <a href="#experience">Pengalaman</a>
        <a href="#about">Tentang</a>
        <a href="#contact" class="nav-cta">Hubungi Saya</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-bg"></div>
      <div class="container hero-inner" id="heroContent"></div>
      <a href="#services" class="scroll-cue" aria-label="Gulir ke bawah"><span></span>Gulir</a>
    </section>

    <!-- Keahlian -->
    <section class="section" id="services">
      <div class="container">
        <div class="head reveal" id="servicesHead"></div>
        <div class="services" id="services-grid"></div>
      </div>
    </section>

    <!-- Galeri -->
    <section class="section section-dark" id="gallery" style="display:none">
      <div class="container">
        <div class="head reveal" id="galleryHead"></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- Video -->
    <section class="section" id="video" style="display:none">
      <div class="container">
        <div class="head reveal" id="videoHead"></div>
        <div class="video-frame reveal" id="video-frame"></div>
      </div>
    </section>

    <!-- Pendidikan -->
    <section class="section section-dark" id="education">
      <div class="container">
        <div class="head reveal" id="educationHead"></div>
        <div class="edu-grid" id="education-grid"></div>
      </div>
    </section>

    <!-- Pengalaman -->
    <section class="section" id="experience">
      <div class="container">
        <div class="head reveal" id="experienceHead"></div>
        <div class="timeline" id="experience-list"></div>
      </div>
    </section>

    <!-- Tentang -->
    <section class="section section-dark" id="about">
      <div class="container about-grid" id="about-inner"></div>
    </section>

    <!-- Kontak -->
    <section class="section" id="contact">
      <div class="container">
        <div class="head reveal" id="contactHead"></div>
        <div class="contact-grid">
          <div class="contact-info reveal" id="contact-info"></div>
          <form class="contact-form reveal" id="contactForm" novalidate>
            <div class="field"><input type="text" id="name" name="name" placeholder=" " required /><label for="name">Nama Anda</label></div>
            <div class="field"><input type="email" id="email" name="email" placeholder=" " required /><label for="email">Email Anda</label></div>
            <div class="field"><textarea id="message" name="message" rows="4" placeholder=" " required></textarea><label for="message">Ceritakan proyek Anda</label></div>
            <button type="submit" class="btn btn-primary btn-full">Kirim Pesan</button>
            <p class="form-note" id="formNote"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal daftar karya -->
  <div class="modal" id="workModal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Tutup">✕</button>
      <span class="kicker" id="modalKicker">Portofolio</span>
      <h3 class="modal-title" id="modalTitle">Judul</h3>
      <div class="modal-list" id="modalList"></div>
    </div>
  </div>

  <!-- Lightbox galeri -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Tutup">✕</button>
    <img id="lbImg" alt="" />
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Muhammad Fakhrul — Creative Professional</p>
      <span class="footer-links">
        <a href="admin.html" class="to-top">⚙️ Panel Admin</a>
        <a href="#hero" class="to-top">Kembali ke atas ↑</a>
      </span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
