# Konfigurasi Nginx untuk situs statis
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompresi agar situs lebih cepat
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache aset (gambar, css, js, font)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Halaman: jika tidak ada, tampilkan 404 bawaan
    location / {
        try_files $uri $uri/ =404;
    }
}
