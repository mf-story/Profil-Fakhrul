<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo-mf.png" type="image/png" />
  <title>Panel Admin — Muhammad Fakhrul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body class="detail-body admin-body">
  <!-- Login -->
  <div class="login-wrap" id="loginScreen" hidden>
    <form class="login-card" id="loginForm">
      <img class="logo-mark" src="logo-mf.png" alt="Muhammad Fakhrul" />
      <h1>Panel Admin</h1>
      <p class="muted">Masuk untuk mengelola isi situs.</p>
      <div class="field"><input type="password" id="loginPw" placeholder=" " required /><label for="loginPw">Password</label></div>
      <button class="btn btn-primary btn-full" type="submit">Masuk</button>
      <p class="form-note" id="loginNote"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="nav scrolled">
      <div class="container nav-inner">
        <a href="index.html" class="logo"><img class="logo-mark" src="logo-mf.png" alt="MF" /><span class="logo-text">Panel Admin</span></a>
        <nav class="nav-links">
          <a href="index.html" target="_blank">Lihat Situs ↗</a>
          <button class="eb-btn primary" id="btnSave">💾 Simpan</button>
          <button class="eb-btn" id="btnLogout">Keluar</button>
        </nav>
      </div>
    </header>

    <main class="admin admin-cms">
      <div class="container cms-layout">
        <aside class="cms-nav" id="cmsNav">
          <button data-panel="hero" class="active">🏠 Hero</button>
          <button data-panel="services">🧩 Keahlian</button>
          <button data-panel="gallery">🖼️ Galeri</button>
          <button data-panel="video">🎬 Video</button>
          <button data-panel="education">🎓 Pendidikan</button>
          <button data-panel="experience">💼 Pengalaman</button>
          <button data-panel="about">👤 Tentang</button>
          <button data-panel="contact">✉️ Kontak</button>
          <button data-panel="projects">📁 Proyek</button>
          <button data-panel="settings">⚙️ Pengaturan</button>
        </aside>
        <section class="cms-panel" id="panel"></section>
      </div>
    </main>
  </div>

  <!-- Editor proyek (modal) -->
  <div class="editor" id="projEditor" aria-hidden="true">
    <div class="editor-backdrop" data-pclose></div>
    <div class="editor-panel">
      <div class="editor-top"><h2 id="projEditorTitle">Proyek</h2><button class="modal-close" data-pclose>✕</button></div>
      <form id="projForm" class="editor-form">
        <input type="hidden" id="pf_id" />
        <div class="fgrid">
          <label class="fld"><span>Nama *</span><input type="text" id="pf_name" required /></label>
          <label class="fld"><span>Kategori (keahlian)</span><select id="pf_cat"></select></label>
          <label class="fld"><span>Tag</span><input type="text" id="pf_tag" /></label>
        </div>
        <label class="fld"><span>Foto sampul</span>
          <div class="img-field"><div class="img-prev" id="pf_coverPrev"></div><div class="img-ctrl"><input type="file" id="pf_coverFile" accept="image/*" /><input type="text" id="pf_cover" placeholder="path/URL gambar" /></div></div>
        </label>
        <label class="fld"><span>Ringkasan</span><textarea id="pf_summary" rows="2"></textarea></label>
        <details class="adv">
          <summary>Detail lanjutan (opsional) — untuk halaman detail proyek</summary>
          <div class="fgrid">
            <label class="fld"><span>Tahun</span><input type="text" id="pf_year" /></label>
            <label class="fld"><span>Peran</span><input type="text" id="pf_role" /></label>
          </div>
          <label class="fld"><span>Teknologi (pisah koma)</span><input type="text" id="pf_tech" /></label>
          <label class="fld"><span>Deskripsi (satu paragraf per baris)</span><textarea id="pf_desc" rows="4"></textarea></label>
          <label class="fld"><span>Fitur (satu per baris)</span><textarea id="pf_features" rows="4"></textarea></label>
          <div class="fld"><span>Tangkapan layar</span><div class="shots-editor" id="pf_shots"></div><button type="button" class="add-row" id="pf_addShot" style="display:inline-block">+ Tambah foto</button></div>
        </details>
        <div class="editor-foot"><button type="submit" class="btn btn-primary">💾 Simpan Proyek</button><button type="button" class="btn btn-outline" data-pclose>Batal</button></div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <template id="shotRowTpl">
    <div class="shot-row"><div class="img-prev sm"></div><div class="img-ctrl"><input type="file" class="s-file" accept="image/*" /><input type="text" class="s-src" placeholder="path/URL" /><input type="text" class="s-cap" placeholder="Keterangan" /></div><button type="button" class="row-del" style="display:inline-grid">×</button></div>
  </template>

  <script src="admin.js?v=3"></script>
</body>
</html>
